version: '3.8'

services:
  # Django 后端
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: forest_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=forest_monitor
      - DATABASE_USER=forest_user
      - DATABASE_PASSWORD=forest_pass
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MQTT_BROKER_HOST=emqx
      - MQTT_BROKER_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=forest-influxdb-super-token-2026
      - INFLUXDB_ORG=forest
      - INFLUXDB_BUCKET=forest_monitor
    depends_on:
      - postgres
      - redis
      - emqx
      - influxdb
    volumes:
      - ./logs:/app/logs
      - ./media:/app/media
    networks:
      - forest_network

  # Celery Worker
  celery_worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: forest_celery_worker
    restart: unless-stopped
    command: celery -A config worker -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=forest_monitor
      - DATABASE_USER=forest_user
      - DATABASE_PASSWORD=forest_pass
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - MQTT_BROKER_HOST=emqx
      - MQTT_BROKER_PORT=1883
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=forest-influxdb-super-token-2026
      - INFLUXDB_ORG=forest
      - INFLUXDB_BUCKET=forest_monitor
    depends_on:
      - postgres
      - redis
      - emqx
      - influxdb
    volumes:
      - ./logs:/app/logs
    networks:
      - forest_network

  # Celery Beat
  celery_beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: forest_celery_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-here}
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_NAME=forest_monitor
      - DATABASE_USER=forest_user
      - DATABASE_PASSWORD=forest_pass
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
    depends_on:
      - postgres
      - redis
    volumes:
      - ./logs:/app/logs
    networks:
      - forest_network

  # PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: forest_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=forest_monitor
      - POSTGRES_USER=forest_user
      - POSTGRES_PASSWORD=forest_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - forest_network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: forest_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - forest_network

  # EMQX (MQTT Broker)
  emqx:
    image: emqx/emqx:5.4
    container_name: forest_emqx
    restart: unless-stopped
    environment:
      - EMQX_NAME=emqx
      - EMQX_HOST=127.0.0.1
    ports:
      - "1883:1883"    # MQTT
      - "8083:8083"    # MQTT WebSocket
      - "8084:8084"    # MQTT WSS
      - "8883:8883"    # MQTT SSL
      - "18083:18083"  # Dashboard
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
    networks:
      - forest_network

  # InfluxDB 2.x
  influxdb:
    image: influxdb:2.7-alpine
    container_name: forest_influxdb
    restart: unless-stopped
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=InfluxAdmin@2026
      - DOCKER_INFLUXDB_INIT_ORG=forest
      - DOCKER_INFLUXDB_INIT_BUCKET=forest_monitor
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=forest-influxdb-super-token-2026
      - DOCKER_INFLUXDB_INIT_RETENTION=365d
    ports:
      - "8086:8086"    # HTTP API + UI
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forest_network

  # MinIO (文件存储)
  minio:
    image: minio/minio:latest
    container_name: forest_minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"    # API
      - "9001:9001"    # Console
    volumes:
      - minio_data:/data
    networks:
      - forest_network

  # RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: forest_rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - forest_network

  # Kafka (KRaft-compatible dual listener for host + docker network)
  # 若本机已有独立 Kafka 容器，可跳过此服务，只需 KAFKA_BOOTSTRAP_SERVERS=localhost:9092
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: forest_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - forest_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: forest_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    ports:
      - "9092:9092"
    networks:
      - forest_network

  # Prometheus（抓取 Django /metrics/）
  # 本机开发时 targets 需能访问 host 上的 Django：host.docker.internal:8000
  prometheus:
    image: prom/prometheus:latest
    container_name: forest_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - forest_network

  # Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: forest_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - forest_network

volumes:
  postgres_data:
  redis_data:
  emqx_data:
  emqx_log:
  influxdb_data:
  influxdb_config:
  minio_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  forest_network:
    driver: bridge
